<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>graphify - graphify-out/graph.html</title>
  <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
    integrity="sha384-Ux6phic9PEHJ38YtrijhkzyJ8yQlH8i/+buBR8s3mAZOJrP1gwyvAcIYl3GWtpX1"
    crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #graph {
      flex: 1;
    }

    #sidebar {
      width: 280px;
      background: #1a1a2e;
      border-left: 1px solid #2a2a4e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #search-wrap {
      padding: 12px;
      border-bottom: 1px solid #2a2a4e;
    }

    #search {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #3a3a5e;
      color: #e0e0e0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    #search:focus {
      border-color: #4E79A7;
    }

    #search-results {
      max-height: 140px;
      overflow-y: auto;
      padding: 4px 12px;
      border-bottom: 1px solid #2a2a4e;
      display: none;
    }

    .search-item {
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item:hover {
      background: #2a2a4e;
    }

    #info-panel {
      padding: 14px;
      border-bottom: 1px solid #2a2a4e;
      min-height: 140px;
    }

    #info-panel h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #info-content {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    #info-content .field {
      margin-bottom: 5px;
    }

    #info-content .field b {
      color: #e0e0e0;
    }

    #info-content .empty {
      color: #555;
      font-style: italic;
    }

    .neighbor-link {
      display: block;
      padding: 2px 6px;
      margin: 2px 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid #333;
    }

    .neighbor-link:hover {
      background: #2a2a4e;
    }

    #neighbors-list {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 4px;
    }

    #legend-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    #legend-wrap h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .legend-item:hover {
      background: #2a2a4e;
      padding-left: 4px;
    }

    .legend-item.dimmed {
      opacity: 0.35;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-count {
      color: #666;
      font-size: 11px;
    }

    #stats {
      padding: 10px 14px;
      border-top: 1px solid #2a2a4e;
      font-size: 11px;
      color: #555;
    }

    #legend-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 4px 0;
    }

    #legend-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #aaa;
      user-select: none;
    }

    #legend-controls label:hover {
      color: #e0e0e0;
    }

    .legend-cb,
    #select-all-cb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #3a3a5e;
      border-radius: 3px;
      background: #0f0f1a;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .legend-cb:checked,
    #select-all-cb:checked {
      background: #4E79A7;
      border-color: #4E79A7;
    }

    .legend-cb:checked::after,
    #select-all-cb:checked::after {
      content: '';
      position: absolute;
      left: 3.5px;
      top: 1px;
      width: 4px;
      height: 7px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    #select-all-cb:indeterminate {
      background: #4E79A7;
      border-color: #4E79A7;
    }

    #select-all-cb:indeterminate::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 5px;
      width: 8px;
      height: 2px;
      background: #fff;
      border: none;
      transform: none;
    }
  </style>
</head>

  <script>
    // Render hyperedges as shaded regions
    const hyperedges = [];
    // afterDrawing passes ctx already transformed to network coordinate space.
    // Draw node positions raw — no manual pan/zoom/DPR math needed.

    // Andrew's monotone chain. Returns the hull in counter-clockwise order, which
    // is what the perimeter must be traced in. Collinear and duplicate points
    // collapse to the extremes, so degenerate member sets render as a segment
    // rather than a zero-area crossed path.
    function convexHull(pts) {
      const p = pts.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
      if (p.length < 3) return p;
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const build = seq => {
        const out = [];
        for (const q of seq) {
          while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], q) <= 0) out.pop();
          out.push(q);
        }
        out.pop();
        return out;
      };
      const hull = build(p).concat(build(p.slice().reverse()));
      return hull.length >= 3 ? hull : p;
    }
    network.on('afterDrawing', function (ctx) {
      hyperedges.forEach(h => {
        const positions = h.nodes
          .map(nid => network.getPositions([nid])[nid])
          .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates.
        // The perimeter must follow hull order, not h.nodes order: tracing the
        // raw member order self-intersects whenever the layout does not happen
        // to place members in angular order, filling as crossed wedges.
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const hull = convexHull(positions);
        const expanded = hull.map(p => ({
          x: cx + (p.x - cx) * 1.15,
          y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
      });
    });
